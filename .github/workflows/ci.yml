name: Validate public source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: python -m pip install -r requirements.lock.txt && python -m pip install --no-deps -e .
      - name: Audit publication candidates and local Git history
        run: python scripts/audit_publication.py
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Prepare PostgreSQL integration image
        run: docker pull postgres:17-alpine
      - name: PostgreSQL integration in isolated container
        working-directory: backend
        run: |
          temp_dir="$(mktemp -d "${RUNNER_TEMP}/investment-dashboard-postgres.XXXXXX")"
          trap 'rm -rf -- "$temp_dir"' EXIT
          INVESTMENT_TEMP_DIR="$temp_dir" python tests/run_postgres.py
      - name: Frontend checks
        working-directory: frontend
        run: npm ci && npm test && npm run build && npm audit --audit-level=high
