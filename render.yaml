# Modelo para revisão futura. NÃO cria banco Supabase ou contas autorizadas.
services:
  - type: web
    name: investment-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.lock.txt && pip install --no-deps .
    # Migrations are manual, with a separate administrative connection.
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: PGSSLROOTCERT
        value: /etc/secrets/supabase-ca.crt
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      # Historical equity prices remain opt-in until the source and its terms are validated.
      - key: EQUITY_HISTORY_ENABLED
        value: false
